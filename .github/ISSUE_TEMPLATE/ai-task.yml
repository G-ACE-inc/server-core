name: AI作業

description: 最小コンテキストでAI作業の目的、再利用候補、変更範囲、期待結果を固定する。
title: "[AI] "
labels:
  - ai-task
body:
  - type: textarea
    id: goal
    attributes:
      label: 変更目的
      description: 何を実現、修正、調査するかを記載する。
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: 対象責務
      description: 対象Module、Part、Feature、Component、System、Application System、または対象ファイルを記載する。分類は判断に必要な範囲へ行う。
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 最小コンテキスト
      description: 再利用候補、入力・出力、直接依存と制約、関連テスト、期待結果を記載する。既存Codeに正本がある内容は参照先を記載する。
      placeholder: |
        再利用候補:
        入力・出力:
        直接依存と制約:
        関連テスト:
        期待結果:
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: 変更範囲
      description: 変更対象と対象外を記載する。AIは対象Code、直接依存、関連テストから開始する。
    validations:
      required: true

  - type: dropdown
    id: commit
    attributes:
      label: commit動作
      options:
        - 完了後にcommitとpush
        - commitのみ
        - commitしない
    validations:
      required: true

  - type: checkboxes
    id: guardrails
    attributes:
      label: 実行確認
      options:
        - label: LibralCoreを再利用、Code生成、局所修正の判断に使用する。
          required: true
        - label: 新規Code生成前に、同じ責務を持つ既存資産を確認する。
          required: true
        - label: 物理構造を対象Projectの規模、再利用範囲、依存、検証、運用上の実益で決定する。
          required: true
        - label: 既存構造への統合を優先し、読込範囲を必要な段階まで拡張する。
          required: true
        - label: 秘密情報はGit管理外の環境で扱う。
          required: true
        - label: 本番デプロイ、起動、公開、切替は明示承認後に行う。
          required: true
        - label: 期待出力、状態変化、主要失敗条件、回帰結果で検証する。
          required: true
