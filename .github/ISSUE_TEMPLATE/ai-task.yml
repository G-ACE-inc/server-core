name: AI作業

description: 最小コンテキストでAI作業の目的、再利用候補、変更範囲、期待結果を固定する。
title: "[AI] "
labels:
  - ai-task
body:
  - type: textarea
    id: goal
    attributes:
      label: 変更目的
      description: 何を実現、修正、調査するかを記載する。
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: 対象責務
      description: 対象Module、Part、Feature、Component、System、Application System、または対象ファイルを記載する。分類が不要なら無理に付けない。
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 最小コンテキスト
      description: 確認できる範囲で、再利用候補、入力・出力、直接依存と制約、関連テスト、期待結果を記載する。既存Codeから確認できる内容は重複記載しない。
      placeholder: |
        再利用候補:
        入力・出力:
        直接依存と制約:
        関連テスト:
        期待結果:
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: 変更範囲
      description: 変更対象と対象外を記載する。AIは対象Code、直接依存、関連テストから開始する。
    validations:
      required: true

  - type: dropdown
    id: commit
    attributes:
      label: commit動作
      options:
        - 完了後にcommitとpush
        - commitのみ
        - commitしない
    validations:
      required: true

  - type: checkboxes
    id: guardrails
    attributes:
      label: 必須Guard
      options:
        - label: LibralCoreは開発時の再利用、Code生成、局所修正の判断にだけ使用する。
          required: true
        - label: 新規Code生成前に、同じ責務を持つ既存資産を確認する。
          required: true
        - label: 5段を理由にファイル、ディレクトリ、パッケージ、Moduleを機械的に増やさない。
          required: true
        - label: 既存構造への統合を優先し、読込範囲は必要時だけ段階拡張する。
          required: true
        - label: `.env` または秘密情報を作成、変更、表示、commitしない。
          required: true
        - label: 明示承認なしに本番デプロイ、起動、公開、切替を行わない。
          required: true
        - label: 起動成功、True、空結果、HTTP 200だけで検証完了としない。
          required: true
