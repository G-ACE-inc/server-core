          test -n "$request_id"
          echo "SERVERCORE_BOUNDED_HOST_REQUEST_ID=$request_id"
          {
            echo "BOUNDED_HOST_REQUEST_ID=$request_id"
            echo "BOUNDED_HOST_COMMAND_ID=$command_id"
            echo "BOUNDED_HOST_EXPECTED_SHA=$expected_sha"
          } >> "$GITHUB_ENV"
          echo "SERVERCORE_BOUNDED_HOST_DISPATCH=QUEUED"

      - name: Bounded Host result return (request id correlated)
        if: ${{ env.BOUNDED_HOST_REQUEST_ID != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/servercore_bounded_result_poll.py \
            --repository "$GITHUB_REPOSITORY" --issue 10 \
            --request-id "$BOUNDED_HOST_REQUEST_ID" \
            --command-id "$BOUNDED_HOST_COMMAND_ID" \
            --expected-sha "$BOUNDED_HOST_EXPECTED_SHA" \
            --observation-json /tmp/gace-chat-host-observation.json


      - name: Persist CHAT host observation for cross-chat recovery
