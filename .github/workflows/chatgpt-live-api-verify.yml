          echo "EXPORT_REPOSITORY=$(jq -r .repository "$file")" >> "$GITHUB_ENV"
          echo "EXPORT_ISSUE=$(jq -r .issue "$file")" >> "$GITHUB_ENV"
      - name: Export full Issue body and comments to TXT and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/issue10_comments_export.py --repository "$EXPORT_REPOSITORY" --issue "$EXPORT_ISSUE"
      - id: issue_artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-issue-full-export-${{ github.run_id }}
          path: /tmp/gace-issue-export/
          if-no-files-found: error
          retention-days: 30
      - name: Index artifact on Project control Issue
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.issue_artifact.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.issue_artifact.outputs.artifact-id }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID" && test -n "$ARTIFACT_URL"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/10/comments" \
            -f body="<!-- GACE_ISSUE_EXPORT run_id=$GITHUB_RUN_ID -->
          Issue export target: $EXPORT_REPOSITORY#$EXPORT_ISSUE
          Issue complete TXT/JSONL/ZIP export: $ARTIFACT_URL
          Artifact ID: $ARTIFACT_ID
          Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          SHA: $(jq -r .text_sha256 /tmp/gace-issue-export/manifest.json)
          Exported comments: $(jq -r .exported_comments /tmp/gace-issue-export/manifest.json)
          Artifact retention: 30 days." >/dev/null
