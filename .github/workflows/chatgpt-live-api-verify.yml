            send+=(--repository "$(jq -r '.bounded_host_request.repository' "$target")" --host-command "$host_command" --repo-sha "$(jq -r '.bounded_host_request.repo_sha' "$target")")
            if [[ "$(jq -r '.bounded_host_request.source_preflight // false' "$target")" == "true" ]]; then send+=(--source-preflight); fi
