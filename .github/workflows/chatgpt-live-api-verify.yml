name: G-ACE Common Chat Host Actions

on:
  push:
    branches:
      - main
      - feat/chat-actions-client-migration-20261011
    paths:
      - '.github/chat-host-requests/**'
      - .github/workflows/chatgpt-live-api-verify.yml

permissions:
  contents: read
  issues: read

concurrency:
  group: common-host-${{ github.sha }}
  cancel-in-progress: false

jobs:
  live-dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current Terminal CHAT request and rule gate
        run: |
          set -euo pipefail
          python3 -m unittest scripts/github_project_chat_turn_gate_test.py -v
          # Assert the same route admission contract used before bounded Host requests.
          python3 scripts/github_project_chat_host_route_test.py
          python3 scripts/github_project_rule_plane_test.py
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SERVERCORE_REGISTERED_TEST_SHA=${GITHUB_SHA}"
          echo "SERVERCORE_REGISTERED_TESTS=PASS"

      - name: Select commit-local CHAT request (without shared target mutation)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/chatgpt_isolated_request_select.py

      - name: Validate current common Terminal request
        shell: bash
        run: |
          set -euo pipefail
          target=/tmp/gace-common-host-request.json
          if [[ ! -f "$target" ]]; then
            echo "COMMON_TERMINAL_IDLE=YES"
            exit 0
          fi
          if [[ "$(jq -r '.bounded_host_request.enabled // false' "$target")" != "true" ]]; then
            echo "COMMON_TERMINAL_IDLE=YES"
            exit 0
          fi
          jq -e '.bounded_host_request.enabled == true and .gitops_request.enabled == false and .source_reflect_request.enabled == false and (.server_command_id // "") == "" and (.run_id // "") == ""' "$target" >/dev/null
          echo "COMMON_TERMINAL_ONLY=PASS"

      - name: START Gate for explicit CHAT Host requests
        shell: bash
        run: |
          set -euo pipefail
          target=/tmp/gace-common-host-request.json
          if [[ ! -f "$target" ]]; then
            echo "COMMON_TERMINAL_IDLE=YES"
            exit 0
          fi
          active="$(jq -r '((.server_command_id // "") != "") or ((.run_id // "") != "") or (.mode == "dogfood") or (.gitops_request.enabled == true) or (.source_reflect_request.enabled == true) or (.bounded_host_request.enabled == true)' "$target")"
          if [[ "$active" == "true" ]]; then
            jq -e '.chat_decision_checkpoint | type == "object"' "$target" >/dev/null || { echo "CHAT_START_GATE_RECEIPT_MISSING"; exit 81; }
            jq -e '.chat_decision_checkpoint.phase == "START"' "$target" >/dev/null || { echo "CHAT_START_GATE_PHASE_DENIED"; exit 82; }
            jq -c '.chat_decision_checkpoint' "$target" > /tmp/gace-chat-start-checkpoint.json
            python3 scripts/github_project_chat_turn_gate.py --state /tmp/gace-chat-start-checkpoint.json
            echo "CHAT_START_GATE=PASS"
          else
            echo "CHAT_START_GATE=IDLE"
          fi

      - name: Common bounded Host gateway dispatch
        shell: bash
        env:
          GACE_EVENT_GATEWAY_URL: ${{ vars.GACE_EVENT_GATEWAY_URL }}
          GACE_EVENT_GATEWAY_TOKEN: ${{ secrets.GACE_EVENT_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          target=/tmp/gace-common-host-request.json
          if [[ ! -f "$target" ]]; then
            echo "COMMON_TERMINAL_IDLE=YES"
            exit 0
          fi
          enabled="$(jq -r '.bounded_host_request.enabled // false' "$target")"
          if [[ "$enabled" != "true" ]]; then
            echo "SERVERCORE_BOUNDED_HOST_DISPATCH=SKIPPED"
            exit 0
          fi
          command_id="$(jq -r '.bounded_host_request.command_id' "$target")"
          expected_sha="$(jq -r '.bounded_host_request.expected_sha' "$target")"
          if [[ "$expected_sha" == "GITHUB_WORKFLOW_SHA" ]]; then
            expected_sha="$GITHUB_SHA"
          fi
          test -n "${GACE_EVENT_GATEWAY_URL:-}" && test -n "${GACE_EVENT_GATEWAY_TOKEN:-}" || {
            echo "SERVERCORE_BOUNDED_HOST_GATEWAY=NOT_CONFIGURED"
            exit 46
          }
          send=(python3 scripts/servercore_bounded_host_gateway_send.py --command-id "$command_id" --expected-sha "$expected_sha")
          if [[ "$command_id" == "project.source_reflect" ]]; then
            send+=(--expected-before "$(jq -r '.bounded_host_request.expected_before' "$target")")
            reflect_repo="$(jq -r '.bounded_host_request.repository // empty' "$target")"
            reflect_branch="$(jq -r '.bounded_host_request.branch // empty' "$target")"
            if [[ -n "$reflect_repo" ]]; then send+=(--reflect-repository "$reflect_repo"); fi
            if [[ -n "$reflect_branch" ]]; then send+=(--reflect-branch "$reflect_branch"); fi
          elif [[ "$command_id" == "service.deploy" ]]; then
            send+=(--repository "$(jq -r '.bounded_host_request.repository' "$target")" --service "$(jq -r '.bounded_host_request.service' "$target")")
          elif [[ "$command_id" == "service.deploy_status" ]]; then
            send+=(--deploy-request-id "$(jq -r '.bounded_host_request.deploy_request_id' "$target")")
          elif [[ "$command_id" == "project.file_inspect" ]]; then
            send+=(--path "$(jq -r '.bounded_host_request.path' "$target")" --offset "$(jq -r '.bounded_host_request.offset' "$target")")
          elif [[ "$command_id" == "host.command" ]]; then
            send+=(--repository "$(jq -r '.bounded_host_request.repository' "$target")" --host-command "$(jq -r '.bounded_host_request.command' "$target")" --repo-sha "$(jq -r '.bounded_host_request.repo_sha' "$target")")
          elif [[ "$command_id" == "docker.operation" ]]; then
            send+=(--repository "$(jq -r '.bounded_host_request.repository' "$target")" --service "$(jq -r '.bounded_host_request.service' "$target")" --docker-operation "$(jq -r '.bounded_host_request.operation' "$target")" --tail "$(jq -r '.bounded_host_request.tail // 100' "$target")" --job-argv-json "$(jq -c '.bounded_host_request.argv // []' "$target")")
          elif [[ "$command_id" == "docker.logs" ]]; then
            send+=(--container "$(jq -r '.bounded_host_request.container' "$target")" --tail "$(jq -r '.bounded_host_request.tail' "$target")")
          elif [[ "$command_id" == "dev.job" ]]; then
            send+=(--repository "$(jq -r '.bounded_host_request.repository' "$target")" --session "$(jq -r '.bounded_host_request.session' "$target")" --job-argv-json "$(jq -c '.bounded_host_request.argv' "$target")" --timeout-s "$(jq -r '.bounded_host_request.timeout_s' "$target")" --fresh "$(jq -r '.bounded_host_request.fresh' "$target")")
            repo_sha="$(jq -r '.bounded_host_request.repo_sha // empty' "$target")"
            if [[ -n "$repo_sha" ]]; then send+=(--repo-sha "$repo_sha"); fi
          fi
          "${send[@]}" | tee /tmp/bounded-host-send.out
          request_id="$(grep -m1 '^{' /tmp/bounded-host-send.out | jq -r '.request_id // empty')"
          test -n "$request_id"
          echo "SERVERCORE_BOUNDED_HOST_REQUEST_ID=$request_id"
          {
            echo "BOUNDED_HOST_REQUEST_ID=$request_id"
            echo "BOUNDED_HOST_COMMAND_ID=$command_id"
            echo "BOUNDED_HOST_EXPECTED_SHA=$expected_sha"
          } >> "$GITHUB_ENV"
          echo "SERVERCORE_BOUNDED_HOST_DISPATCH=QUEUED"

      - name: Bounded Host result return (request id correlated)
        if: ${{ env.BOUNDED_HOST_REQUEST_ID != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/servercore_bounded_result_poll.py \
            --repository "$GITHUB_REPOSITORY" --issue 10 \
            --request-id "$BOUNDED_HOST_REQUEST_ID" \
            --command-id "$BOUNDED_HOST_COMMAND_ID" \
            --expected-sha "$BOUNDED_HOST_EXPECTED_SHA"

