name: G-ACE Common Chat Host Actions

# CURRENT shared Server Terminal only. Retired DebugAI product API is not a CHAT executor.
on:
  push:
    branches:
      - main
    paths:
      - '.github/chat-host-requests/**'
      - .github/workflows/chatgpt-live-api-verify.yml
      - scripts/chatgpt_isolated_request_select.py
      - scripts/servercore_bounded_host_gateway_send.py
      - scripts/servercore_bounded_result_poll.py

permissions:
  contents: read
  issues: read

concurrency:
  group: chatgpt-live-dogfood-${{ contains(github.event.head_commit.message, '[isolated-host-request]') && github.sha || 'legacy' }}
  cancel-in-progress: false

jobs:
  live-dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify existing current-terminal control plane
        run: |
          set -euo pipefail
          python3 -m unittest scripts/github_project_chat_turn_gate_test.py -v
          python3 scripts/github_project_chat_host_route_test.py
          python3 scripts/github_project_rule_plane_test.py
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "CURRENT_TERMINAL_CONTROL=PASS"

      - name: Select a commit-local common Terminal request
        id: select
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/chatgpt_isolated_request_select.py | tee /tmp/current-terminal-selection.txt
          if grep -q '^CHAT_ISOLATED_REQUEST=SELECTED$' /tmp/current-terminal-selection.txt; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "selected=false" >> "$GITHUB_OUTPUT"
            echo "CURRENT_TERMINAL_REQUEST=NONE"
          fi

      - name: Validate current Terminal arbitrary command and START decision
        if: ${{ steps.select.outputs.selected == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          target=.github/chatgpt-live-api-target.json
          jq -e '.bounded_host_request.enabled == true and
            .bounded_host_request.command_id == "host.command" and
            (.bounded_host_request.repository | type == "string") and
            (.bounded_host_request.repo_sha | type == "string") and
            (.bounded_host_request.command | type == "string") and
            .gitops_request.enabled == false and
            .source_reflect_request.enabled == false and
            ((.server_command_id // "") == "")' "$target" >/dev/null
          jq -e '.chat_decision_checkpoint | type == "object"' "$target" >/dev/null || { echo "CHAT_START_GATE_RECEIPT_MISSING"; exit 81; }
          jq -e '.chat_decision_checkpoint.phase == "START"' "$target" >/dev/null || { echo "CHAT_START_GATE_PHASE_DENIED"; exit 82; }
          jq -c '.chat_decision_checkpoint' "$target" > /tmp/gace-chat-start-checkpoint.json
          python3 scripts/github_project_chat_turn_gate.py --state /tmp/gace-chat-start-checkpoint.json
          echo "CHAT_START_GATE=PASS"
          echo "CURRENT_TERMINAL_COMMAND=host.command"

      - name: Dispatch current common Server Terminal command
        if: ${{ steps.select.outputs.selected == 'true' }}
        shell: bash
        env:
          GACE_EVENT_GATEWAY_URL: ${{ vars.GACE_EVENT_GATEWAY_URL }}
          GACE_EVENT_GATEWAY_TOKEN: ${{ secrets.GACE_EVENT_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          target=.github/chatgpt-live-api-target.json
          test -n "${GACE_EVENT_GATEWAY_URL:-}" && test -n "${GACE_EVENT_GATEWAY_TOKEN:-}"
          expected_sha="$(jq -r '.bounded_host_request.expected_sha' "$target")"
          if [[ "$expected_sha" == "GITHUB_WORKFLOW_SHA" ]]; then expected_sha="$GITHUB_SHA"; fi
          python3 scripts/servercore_bounded_host_gateway_send.py \
            --command-id host.command \
            --expected-sha "$expected_sha" \
            --repository "$(jq -r '.bounded_host_request.repository' "$target")" \
            --repo-sha "$(jq -r '.bounded_host_request.repo_sha' "$target")" \
            --host-command "$(jq -r '.bounded_host_request.command' "$target")" \
            | tee /tmp/current-terminal-send.out
          request_id="$(grep -m1 '^{' /tmp/current-terminal-send.out | jq -r '.request_id // empty')"
          test -n "$request_id"
          {
            echo "BOUNDED_HOST_REQUEST_ID=$request_id"
            echo "BOUNDED_HOST_COMMAND_ID=host.command"
            echo "BOUNDED_HOST_EXPECTED_SHA=$expected_sha"
          } >> "$GITHUB_ENV"
          echo "CURRENT_TERMINAL_DISPATCH=QUEUED"

      - name: Read back correlated Host result
        if: ${{ steps.select.outputs.selected == 'true' && env.BOUNDED_HOST_REQUEST_ID != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/servercore_bounded_result_poll.py \
            --repository "$GITHUB_REPOSITORY" --issue 10 \
            --request-id "$BOUNDED_HOST_REQUEST_ID" \
            --command-id "$BOUNDED_HOST_COMMAND_ID" \
            --expected-sha "$BOUNDED_HOST_EXPECTED_SHA"
