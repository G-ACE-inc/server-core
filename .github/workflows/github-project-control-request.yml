name: GitHub Project Control Request

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: github-project-control-request-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  validate-request:
    if: >-
      github.event.comment.user.login == 'seigo-gace' &&
      startsWith(github.event.comment.body, '[GACE-PROJECT]')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build bounded request from owner comment
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/github_project_request_from_comment.py             "$GITHUB_EVENT_PATH"             github-project-control-request.json             github-project-control-meta.json
          request_id="$(python3 -c "import json; print(json.load(open('github-project-control-request.json'))['id'])")"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"

      - name: Validate against Project control contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/github_project_control.py             --request github-project-control-request.json             --validate-only
          echo 'PROJECT_CONTROL_EXECUTION=NOT_RUN'

      - name: Upload bounded request evidence
        uses: actions/upload-artifact@v4
        with:
          name: github-project-control-request-${{ github.run_id }}
          path: |
            github-project-control-request.json
            github-project-control-meta.json
          if-no-files-found: error
          retention-days: 1

      - name: Comment validated request evidence
        uses: actions/github-script@v7
        env:
          REQUEST_ID: ${{ steps.build.outputs.request_id }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'G-ACE Project control request validated.',
              '',
              `- REQUEST_ID: ${process.env.REQUEST_ID}`,
              '- REQUEST_VALIDATION: PASS',
              '- PROJECT_CONTROL_EXECUTION: NOT_RUN',
              `- artifact: github-project-control-request-${context.runId}`,
              `- workflow run: ${runUrl}`,
              '',
              'Validation does not mean the Project field was mutated. Server-side execution remains a separate gate.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Comment validation failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `G-ACE Project control request validation failed. No Project mutation was executed.\n\nWorkflow run: ${runUrl}`,
            });
