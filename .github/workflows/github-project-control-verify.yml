name: github-project-control-verify

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# Bound superseded runs per Git ref; PR and Push each execute the actual required checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Project Control tests
        run: |
          python3 -m py_compile scripts/github_project_control.py scripts/github_project_control_test.py scripts/github_project_request_from_comment.py scripts/github_project_request_from_comment_test.py scripts/github_project_internal_send.py scripts/github_project_internal_receiver.py scripts/github_project_internal_transport_test.py scripts/github_project_runtime_config_test.py
          python3 scripts/github_project_control_test.py
          python3 -m py_compile scripts/gace_project_current_recovery.py scripts/gace_project_current_recovery_test.py
          python3 -m unittest scripts/gace_project_current_recovery_test.py -v
          python3 scripts/github_project_request_from_comment_test.py
          python3 scripts/github_project_internal_transport_test.py
          python3 scripts/github_project_runtime_config_test.py
      - name: Concurrent CHAT isolated request selection tests
        run: |
          python3 -m py_compile scripts/chatgpt_isolated_request_select.py tests/chatgpt_isolated_request_select_test.py
          python3 -m unittest discover -s tests -p chatgpt_isolated_request_select_test.py -v
          python3 -m unittest discover -s tests -p chat_host_command_prepare_test.py -v
          python3 -m unittest scripts.chat_cu_continuation_test scripts.chat_host_observation_artifact_readback_test scripts.chat_host_observation_gh_restore_test -v
          python3 -m unittest discover -s scripts -p 'chat_notion*_test.py' -v
          python3 -m unittest scripts.servercore_host_output_artifact_assemble_test -v
          python3 -m unittest scripts.servercore_bounded_result_poll_test -v
      - name: Server-core independent bounded Host unit tests
        run: |
          python3 -m py_compile scripts/servercore_bounded_host.py tests/servercore_bounded_host_test.py
          python3 -m unittest discover -s tests -p servercore_bounded_host_test.py -v
      - name: Bounded Host transport and runtime config
        run: |
          python3 -m py_compile scripts/gace_internal_delivery_auth.py scripts/servercore_bounded_host_receiver.py scripts/servercore_bounded_host_gateway_send.py scripts/github_project_bounded_host_transport_test.py scripts/github_project_bounded_host_runtime_config_test.py
          python3 scripts/github_project_bounded_host_transport_test.py
          python3 scripts/github_project_bounded_host_runtime_config_test.py
          docker build -f Dockerfile.bounded-host -t gace-server-core-bounded-host:ci .
      - name: Canonical Source reflect fail-closed tests
        run: |
          python3 -m py_compile scripts/servercore_source_reflect.py tests/servercore_source_reflect_test.py
          python3 -m unittest discover -s tests -p servercore_source_reflect_test.py -v
      - name: Segregated UNIX source reflect admission tests
        run: |
          python3 -m py_compile scripts/servercore_source_reflect_socket.py scripts/servercore_bounded_host_receiver.py scripts/servercore_bounded_host_gateway_send.py tests/servercore_source_reflect_socket_test.py
          python3 -m unittest discover -s tests -p servercore_source_reflect_socket_test.py -v
          python3 -m py_compile scripts/servercore_source_reflect_admission.py tests/servercore_source_reflect_admission_test.py tests/servercore_registered_repository_contract_test.py
          python3 -m unittest discover -s tests -p servercore_source_reflect_admission_test.py -v
          python3 -m unittest discover -s tests -p servercore_registered_repository_contract_test.py -v
      - name: Host source-reflect bootstrap admission tests
        run: |
          python3 -m py_compile scripts/servercore_source_reflect_host_bootstrap.py tests/servercore_source_reflect_host_bootstrap_test.py
          python3 -m unittest discover -s tests -p servercore_source_reflect_host_bootstrap_test.py -v
      - name: Registered service deploy admission tests
        run: |
          python3 -m py_compile scripts/servercore_service_deploy_admission.py tests/servercore_service_deploy_admission_test.py
          python3 -m unittest discover -s tests -p servercore_service_deploy_admission_test.py -v
      - name: Fixed registered service executor tests
        run: |
          python3 -m py_compile scripts/servercore_registered_service_deploy.py tests/servercore_registered_service_deploy_test.py
          python3 -m unittest discover -s tests -p servercore_registered_service_deploy_test.py -v
      - name: Registered service deploy writer and installer tests
        run: |
          python3 -m py_compile scripts/servercore_service_deploy_socket.py scripts/servercore_service_deploy_host_bootstrap.py tests/servercore_service_deploy_socket_test.py tests/servercore_service_deploy_host_bootstrap_test.py
          python3 -m unittest discover -s tests -p servercore_service_deploy_socket_test.py -v
          python3 -m unittest discover -s tests -p servercore_service_deploy_host_bootstrap_test.py -v
      - name: Bounded Host result return tests
        run: |
          python3 -m py_compile scripts/servercore_result_sink.py scripts/servercore_bounded_result_poll.py scripts/servercore_result_sink_host_bootstrap.py tests/servercore_result_return_test.py tests/servercore_result_sink_host_bootstrap_test.py
          python3 -m unittest discover -s tests -p servercore_result_return_test.py -v
          python3 -m unittest discover -s tests -p servercore_result_sink_host_bootstrap_test.py -v
      - name: Bounded Host file inspect and Docker log reader tests
        run: |
          python3 -m py_compile scripts/servercore_docker_logs_socket.py scripts/servercore_docker_logs_host_bootstrap.py tests/servercore_bounded_extension_test.py tests/servercore_docker_logs_host_bootstrap_test.py
          python3 -m unittest discover -s tests -p servercore_bounded_extension_test.py -v
          python3 -m unittest discover -s tests -p servercore_docker_logs_host_bootstrap_test.py -v
      - name: Isolated development job provisioner tests
        run: |
          python3 -m py_compile scripts/servercore_dev_job_socket.py scripts/servercore_dev_job_host_bootstrap.py tests/servercore_dev_job_test.py tests/servercore_dev_job_host_bootstrap_test.py
          python3 -m unittest discover -s tests -p servercore_dev_job_test.py -v
          python3 -m unittest discover -s tests -p servercore_dev_job_host_bootstrap_test.py -v
      - name: TGserver ZERO full deploy coverage audit tests
        run: |
          python3 -m py_compile scripts/tgzero_deploy_coverage.py tests/tgzero_deploy_coverage_test.py
          python3 -m unittest discover -s tests -p tgzero_deploy_coverage_test.py -v
      - name: Project Control container source
        run: |
          docker build --build-arg GACE_PYTHON_BASE_IMAGE=public.ecr.aws/docker/library/python:3.13-alpine -f Dockerfile.project-control -t gace-server-core-project-control:ci .
          docker run --rm --entrypoint python3 gace-server-core-project-control:ci -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'
          GACE_SERVER_UID=10001 GACE_SERVER_GID=10001 GACE_PROJECT_CONTROL_GH_CONFIG_DIR=/tmp/gace-gh-config GACE_PROJECT_CONTROL_DELIVERY_SECRET_FILE=/tmp/gace-pc-hmac-key GACE_BOUNDED_HOST_CANONICAL_ROOT=/tmp/gace-server-core-canonical GACE_BOUNDED_HOST_HMAC_KEY_FILE=/tmp/gace-bh-hmac-key docker compose -f docker-compose.project-control.yml config --quiet
