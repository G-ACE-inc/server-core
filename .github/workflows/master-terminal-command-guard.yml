name: master-terminal-command-guard

on:
  pull_request:
    paths:
      - 'docs/MASTER_TERMINAL_COMMAND.md'
      - 'docs/COMMAND_ROUTINE.md'
      - 'docs/LOAD_SCOPE.md'
      - '.cursor/rules/02_master_terminal_command.mdc'
      - '.github/workflows/master-terminal-command-guard.yml'
  push:
    branches: [main]
    paths:
      - 'docs/MASTER_TERMINAL_COMMAND.md'
      - 'docs/COMMAND_ROUTINE.md'
      - 'docs/LOAD_SCOPE.md'
      - '.cursor/rules/02_master_terminal_command.mdc'
      - '.github/workflows/master-terminal-command-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exactly two command-authoring authorities
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/COMMAND_ROUTINE.md
          test -s docs/MASTER_TERMINAL_COMMAND.md
          grep -q 'host.command' docs/COMMAND_ROUTINE.md
          grep -q 'MASTER TERMINAL COMMAND CONTRACT' docs/MASTER_TERMINAL_COMMAND.md
          grep -q 'COMMAND_ROUTINE.md' .cursor/rules/02_master_terminal_command.mdc
          grep -q 'MASTER_TERMINAL_COMMAND.md' .cursor/rules/02_master_terminal_command.mdc
          grep -q 'alwaysApply: true' .cursor/rules/02_master_terminal_command.mdc
          grep -q 'MASTER_TERMINAL_COMMAND.md' docs/LOAD_SCOPE.md
