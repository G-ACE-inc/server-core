name: project-control-runtime-readback-command-verify

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# Bound superseded runs per Git ref; PR and Push each execute the actual required checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-parser:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Select affected execution profile
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/server_core_ci_scope.py --base "$env:CI_BASE_SHA" --output "$env:GITHUB_OUTPUT"
      - name: Parse exact Master PowerShell launcher
        if: steps.scope.outputs.remote_chat == 'true'
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/project_control_runtime_readback_launcher.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if($errors.Count -ne 0){$errors | ForEach-Object { Write-Error $_.Message }; throw 'POWERSHELL_PARSE_FAILED'}
          Write-Host 'PROJECT_CONTROL_RUNTIME_READBACK_LAUNCHER_PARSE=PASS'
