name: project-control-runtime-readback-command-verify

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# Same exact Source SHA from push and PR must not consume duplicate CI capacity.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-parser:
    # This repository's PR SHA is already tested by its push check. For fork PRs,
    # no trusted local push exists, so run the complete PR check as before.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse exact Master PowerShell launcher
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/project_control_runtime_readback_launcher.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if($errors.Count -ne 0){$errors | ForEach-Object { Write-Error $_.Message }; throw 'POWERSHELL_PARSE_FAILED'}
          Write-Host 'PROJECT_CONTROL_RUNTIME_READBACK_LAUNCHER_PARSE=PASS'
