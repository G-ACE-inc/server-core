name: server-core-behavior

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-core-behavior-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Shell and Python syntax
        run: |
          set -euo pipefail
          bash -n scripts/init-dev-workspace.sh scripts/install-workspace-mcp.sh scripts/verify-workspace-mcp.sh scripts/ai-auto-commit.sh scripts/resolve-codex-skill.sh scripts/github-skill-path.sh
          python3 -m py_compile scripts/storage_lifecycle_audit.py scripts/workspace_command_center_check.py scripts/github_project_control.py scripts/github_project_control_test.py scripts/github_project_request_from_comment.py scripts/github_project_request_from_comment_test.py scripts/github_project_internal_send.py scripts/github_project_internal_receiver.py scripts/github_project_internal_transport_test.py

      - name: Command-center dispatch schema and workflow scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('operations/pre-execution-schema.json').read_text())
          assert p['schema_version'] == '1.5'
          assert p['name'] == 'gace-command-center-dispatch'
          required=set(p['required_fields'])
          must={'PURPOSE','EXPECTED_RESULT','TARGET_PROJECT','TARGET_REPOSITORY','MUTATION_REPOSITORIES','READ_ONLY_REPOSITORIES','SERVER_CORE_MUTATION_AUTHORIZED','REQUIRED_SERVER_CORE_AUTHORITY','REQUIRED_PROJECT_AUTHORITY','REUSE_CANDIDATES','VERIFY_PATH','APPROVAL_BOUNDARY','CHANGE_BOUNDARY','CONTEXT_SCOPE','BLOCKER'}
          assert must <= required
          assert 'NEXT_ACTION' not in required
          assert 'EXECUTION_ROUTE' not in required
          assert 'EXECUTION_CAPABILITY' not in required
          assert 'EXECUTION_AUTHORIZATION' not in required
          assert 'MUTATION_CLASS' not in required
          assert 'PRE_EXECUTION_COMPLETE' not in required
          assert 'execution_routes' not in p
          assert 'mutation_classes' not in p
          assert p['rules']['fixed_development_routine_must_not_be_skipped_without_reason'] is True
          assert p['rules']['debugai_reuses_existing_evidence_before_server_ai_research'] is True
          assert 'chat_ui_notion_and_external_app_interaction_are_outside_server_core' not in p['rules']
          print('COMMAND_CENTER_DISPATCH_SCHEMA=PASS')
          PY
          grep -q '## 7. Development Routine' docs/G_ACE_WORKSPACE.md
          grep -q 'fixed, repeatable workflow' docs/SERVER_CORE_DESIGN.md
          grep -q '## 3. Shell / Process Safety' docs/SERVER_COMMAND_CONTRACT.md
          grep -q 'parent interactive shell' docs/SERVER_COMMAND_CONTRACT.md
          grep -q '## 8. DebugAI / Cost Routing Rule' docs/LOAD_SCOPE.md
          ! git grep -nE 'Workspace top-level|GPT↔operator|operator-facing command presentation|ASSISTANT_TOOL|USER_UI|EXTERNAL_CLIENT|EXECUTION_ROUTE|EXECUTION_CAPABILITY|EXECUTION_AUTHORIZATION|PRE_EXECUTION_COMPLETE|Chat UI|ChatGPT|Notion|generic executor|generic AI cost policy' -- README.md docs/SERVER_CORE_DESIGN.md docs/G_ACE_WORKSPACE.md docs/LOAD_SCOPE.md docs/SERVER_COMMAND_CONTRACT.md .cursor/rules/00_agent_runtime.mdc operations/pre-execution-schema.json
          echo 'WORKFLOW_SCOPE=PASS'

      - name: GitHub Project control contract
        run: |
          set -euo pipefail
          python3 scripts/github_project_control_test.py
          python3 scripts/github_project_request_from_comment_test.py
          python3 scripts/github_project_internal_transport_test.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('operations/github-project-control.json').read_text())
          assert p['schema_version'] == '1.0'
          assert p['request_schema'] == 'gace.github-project-control/v1'
          assert p['project'] == {'owner':'seigo-gace','number':1,'node_id':'PVT_kwHODOQFoM4BEJII','title':'G-ACE Development Platform'}
          assert set(p['allowed_fields']) == {'Wave','Gate','Change Unit','Mutation Owner'}
          assert p['rules']['arbitrary_shell_forbidden'] is True
          assert p['rules']['exact_readback_required'] is True
          t=p['internal_event_transport']
          assert t['producer_endpoint'] == '/internal/events'
          assert t['destination_id'] == 'server-core-project-control'
          assert t['receiver_endpoint'] == '/internal/github-project-control'
          assert t['payload_mode'] == 'json'
          assert t['gateway_destination_registration_required'] is True
          assert t['result_sink'] == {'repository':'G-ACE-inc/server-core','issue_number':10,'dedupe_window_comments':100}
          assert t['runtime_verified'] is False
          workflow=Path('.github/workflows/github-project-control-request.yml').read_text()
          assert 'scripts/github_project_internal_send.py' in workflow
          assert 'PENDING_SERVER_RESULT' in workflow
          assert 'PROJECT_CONTROL_EXECUTION=NOT_RUN' not in workflow
          print('GITHUB_PROJECT_CONTROL_CONTRACT=PASS')
          PY

      - name: Project path traversal guard
        run: |
          set -euo pipefail
          grep -q 'validate_project_name' scripts/init-dev-workspace.sh
          grep -q 'unsafe project name' scripts/init-dev-workspace.sh
          ! grep -q 'mkdir -p "$TARGET"' scripts/init-dev-workspace.sh
          grep -q 'mkdir -p -- "$TARGET"' scripts/init-dev-workspace.sh

      - name: Skill resolver full read and glob rejection
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          skill="$tmp/plugins/cache/openai-curated-remote/github/9.9.9/skills/demo"
          mkdir -p "$skill"
          seq 1 300 | sed 's/^/line-/' > "$skill/SKILL.md"
          out="$(CODEX_HOME="$tmp" scripts/resolve-codex-skill.sh github:demo --read)"
          test "$(printf '%s\n' "$out" | wc -l)" -eq 300
          test "$(printf '%s\n' "$out" | tail -n 1)" = 'line-300'
          if CODEX_HOME="$tmp" scripts/resolve-codex-skill.sh 'github:*' --read >"$tmp/glob.out" 2>&1; then exit 1; fi
          echo 'SKILL_RESOLVER_BEHAVIOR=PASS'

      - name: MCP permission and credential-container behavior
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/.cursor"
          cat > "$tmp/.cursor/mcp.json" <<'JSON'
          {"mcpServers":{"cloudflare-api":{"url":"https://mcp.cloudflare.com/mcp","auth":{"CLIENT_ID":"8ilRHxRMw6Ntq3dP"}},"huggingface":{"url":"https://huggingface.co/mcp","headers":{"Authorization":"Bearer FIXTURE_LOCAL_CREDENTIAL_123456"}}}}
          JSON
          chmod 0644 "$tmp/.cursor/mcp.json"
          cp "$tmp/.cursor/mcp.json" "$tmp/before.json"
          if HOME="$tmp" bash scripts/install-workspace-mcp.sh >"$tmp/noauth.out" 2>&1; then exit 1; fi
          cmp "$tmp/before.json" "$tmp/.cursor/mcp.json"
          ( exec 8<"$tmp"; flock -x 8; sleep 1 ) & lock_pid=$!
          sleep 0.1
          set +e
          HOME="$tmp" bash scripts/install-workspace-mcp.sh --apply-workspace-mcp-mutation >"$tmp/locked.out" 2>&1
          lock_rc=$?
          set -e
          test "$lock_rc" -ne 0
          grep -q 'another Workspace MCP mutation is active' "$tmp/locked.out"
          cmp "$tmp/before.json" "$tmp/.cursor/mcp.json"
          wait "$lock_pid"
          HOME="$tmp" bash scripts/install-workspace-mcp.sh --apply-workspace-mcp-mutation >"$tmp/install-pass.out"
          grep -q '^GACE_MCP_INSTALL_RESULT_BEGIN$' "$tmp/install-pass.out"
          grep -q '^RESULT=PASS$' "$tmp/install-pass.out"
          grep -q '^CONFIG_UPDATED=YES$' "$tmp/install-pass.out"
          grep -q '^GACE_MCP_INSTALL_RESULT_END$' "$tmp/install-pass.out"
          test "$(stat -c '%a' "$tmp/.cursor/mcp.json")" = 600
          grep -q 'FIXTURE_LOCAL_CREDENTIAL_123456' "$tmp/.cursor/mcp.json"
          HOME="$tmp" bash scripts/verify-workspace-mcp.sh >"$tmp/verify.out"
          grep -q 'WORKSPACE_MCP_CONFIG=PASS' "$tmp/verify.out"
          grep -q 'MCP_CLIENT_CREDENTIAL_CONTAINERS=PERMITTED_NOT_DISCLOSED' "$tmp/verify.out"
          ! grep -q 'FIXTURE_LOCAL_CREDENTIAL_123456' "$tmp/verify.out"
          chmod 0500 "$tmp/.cursor/mcp.json"
          HOME="$tmp" bash scripts/install-workspace-mcp.sh --apply-workspace-mcp-mutation >"$tmp/mode-normalize.out"
          grep -q '^RESULT=PASS$' "$tmp/mode-normalize.out"
          grep -q '^CONFIG_UPDATED=YES$' "$tmp/mode-normalize.out"
          test "$(stat -c '%a' "$tmp/.cursor/mcp.json")" = 400
          HOME="$tmp" bash scripts/verify-workspace-mcp.sh >"$tmp/verify-0400.out"
          grep -q 'WORKSPACE_MCP_CONFIG=PASS' "$tmp/verify-0400.out"
          chmod 0700 "$tmp/.cursor/mcp.json"
          set +e
          HOME="$tmp" bash scripts/verify-workspace-mcp.sh >"$tmp/verify-0700.out" 2>&1
          bad_mode_rc=$?
          set -e
          test "$bad_mode_rc" -ne 0
          grep -q 'owner-only non-executable 0400 or 0600' "$tmp/verify-0700.out"
          chmod 0600 "$tmp/.cursor/mcp.json"
          test "$(find "$tmp/.cursor" -maxdepth 1 -name 'mcp.json.backup-*' | wc -l)" -le 3
          partial="$tmp/partial-home"
          mkdir -p "$partial/.cursor"
          cat > "$partial/.cursor/mcp.json" <<'JSON'
          {"mcpServers":{"cloudflare-api":{"url":"https://mcp.cloudflare.com/mcp","auth":{"CLIENT_ID":"8ilRHxRMw6Ntq3dP"}}}}
          JSON
          chmod 0600 "$partial/.cursor/mcp.json"
          for n in 1 2 3 4; do mkdir "$partial/.cursor/mcp.json.backup-20000101-00000${n}-${n}"; done
          set +e
          HOME="$partial" bash scripts/install-workspace-mcp.sh --apply-workspace-mcp-mutation >"$tmp/partial.out" 2>&1
          partial_rc=$?
          set -e
          test "$partial_rc" -ne 0
          grep -q '^RESULT=PARTIAL$' "$tmp/partial.out"
          grep -q '^CONFIG_UPDATED=YES$' "$tmp/partial.out"
          grep -q '^BACKUP_RETENTION=FAIL$' "$tmp/partial.out"
          grep -q '"huggingface"' "$partial/.cursor/mcp.json"
          grep -q 'BACKUP_RETENTION=FAIL' scripts/init-dev-workspace.sh
          echo 'MCP_PERMISSION_BEHAVIOR=PASS'

      - name: Auto-commit explicit change unit, rollback, and partial push
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git clone -q "$GITHUB_WORKSPACE" "$tmp/repo"
          cd "$tmp/repo"
          git checkout -q -b ci-helper-test
          git config user.name 'server-core-ci'
          git config user.email 'server-core-ci@example.invalid'
          printf '\nci-a\n' >> README.md
          printf '\nci-b\n' >> CORE.md
          lock="$(git rev-parse --git-dir)/gace-ai-auto-commit.lock"
          ( exec 8>"$lock"; flock -x 8; sleep 1 ) & lock_pid=$!
          sleep 0.1
          set +e
          bash scripts/ai-auto-commit.sh --authorize-server-core-mutation --file README.md -m 'test: concurrent refusal' >"$tmp/lock.out" 2>&1
          lock_rc=$?
          set -e
          test "$lock_rc" -ne 0
          grep -q 'another server-core auto-commit change unit is active' "$tmp/lock.out"
          wait "$lock_pid"
          bash scripts/ai-auto-commit.sh --authorize-server-core-mutation --file README.md -m 'test: explicit change unit'
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],text=True).splitlines()
          assert changed == ['README.md'], f'committed_set={changed!r}'
          core=subprocess.check_output(['git','status','--porcelain=v1','--','CORE.md'],text=True).strip()
          assert core, 'CORE.md unrelated change disappeared'
          PY
          printf 'space-path\n' > 'docs/space fixture.md'
          bash scripts/ai-auto-commit.sh --authorize-server-core-mutation --file 'docs/space fixture.md' -m 'test: whitespace path change unit'
          git show --format= --name-only HEAD | grep -Fxq 'docs/space fixture.md'
          printf '{"token":"SUPER_SECRET_VALUE_123456789"}\n' > ci-secret.json
          set +e
          bash scripts/ai-auto-commit.sh --authorize-server-core-mutation --file ci-secret.json -m 'test: secret guard' >"$tmp/secret.out" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0 || { echo 'secret-like JSON was committed' >&2; exit 1; }
          grep -q 'ci-secret.json:1' "$tmp/secret.out" || { cat "$tmp/secret.out" >&2; exit 1; }
          if grep -q 'SUPER_SECRET_VALUE_123456789' "$tmp/secret.out"; then echo 'secret value leaked in helper output' >&2; exit 1; fi
          rm -f ci-secret.json
          git add CORE.md
          printf '\nci-core-extra\n' >> CORE.md
          before_stage="$(git diff --cached -- CORE.md)"
          set +e
          bash scripts/ai-auto-commit.sh --authorize-server-core-mutation --file CORE.md -m 'test: pre-staged refusal' >"$tmp/prestaged.out" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'already has staged content' "$tmp/prestaged.out"
          test "$(git diff --cached -- CORE.md)" = "$before_stage"
          git reset -q -- CORE.md
          mkdir -p .git/hooks
          printf '#!/usr/bin/env bash\nexit 1\n' > .git/hooks/pre-commit
          chmod +x .git/hooks/pre-commit
          printf '\nci-hook-fail\n' >> README.md
          set +e
          bash scripts/ai-auto-commit.sh --authorize-server-core-mutation --file README.md -m 'test: hook failure rollback' >"$tmp/hook.out" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          git diff --cached --quiet -- README.md
          test -n "$(git status --porcelain=v1 -- README.md)"
          rm -f .git/hooks/pre-commit
          bash scripts/ai-auto-commit.sh --authorize-server-core-mutation --file README.md -m 'test: recover after hook failure'
          printf '\nci-push-partial\n' >> README.md
          git remote set-url origin "$tmp/not-a-repository"
          set +e
          bash scripts/ai-auto-commit.sh --authorize-server-core-mutation --file README.md --push -m 'test: push partial state' >"$tmp/push.out" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'RESULT=PARTIAL COMMIT=PASS PUSH=FAIL SHA=' "$tmp/push.out"
          git diff --cached --quiet -- README.md
          git show --format= --name-only HEAD | grep -qx 'README.md'
          echo 'AUTO_COMMIT_BEHAVIOR=PASS'

      - name: Workspace wiring result scope
        run: |
          set -euo pipefail
          grep -q 'WORKSPACE_WIRING=PASS' scripts/workspace_command_center_check.py
          grep -q 'NOT_PROVEN=FULL_AUTHORITY_COMPLETENESS,SCRIPT_SAFETY,PROJECT_RUNTIME,PROVIDER_AVAILABILITY' scripts/workspace_command_center_check.py
          ! grep -q 'WORKSPACE_COMMAND_CENTER=PASS' scripts/workspace_command_center_check.py
          echo 'WORKSPACE_WIRING_SCOPE=PASS'

      - name: Storage audit bounded result
        run: |
          set -euo pipefail
          python3 scripts/storage_lifecycle_audit.py --self-test
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/root/a/b/c"
          printf x > "$tmp/root/a/b/c/file"
          cat > "$tmp/policy.json" <<JSON
          {"mode":"audit_only","allow_delete":false,"roots":[{"path":"$tmp/root","class":"test","default_action":"preserve"}],"docker":{"inspect":false,"allow_prune":false,"allow_volume_delete":false},"disk_pressure":{},"safety":{"unknown_owner":"preserve"}}
          JSON
          set +e
          python3 scripts/storage_lifecycle_audit.py --policy "$tmp/policy.json" --max-depth 1 --max-files 10 --max-seconds 2 > "$tmp/audit.out"
          rc=$?
          set -e
          test "$rc" -eq 3
          grep -q '^GACE_RESULT_BEGIN$' "$tmp/audit.out"
          grep -q '^RESULT=PARTIAL$' "$tmp/audit.out"
          grep -q 'full_scan=False' "$tmp/audit.out"
          grep -q '^GACE_RESULT_END$' "$tmp/audit.out"
          echo 'STORAGE_BOUNDED_BEHAVIOR=PASS'