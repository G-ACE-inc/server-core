name: server-core-guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-core-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Required authority and machine contracts
        run: |
          set -euo pipefail
          required=(README.md AGENTS.md CORE.md SERVER_CORE_PROTOCOL.md .github/copilot-instructions.md .github/dependabot.yml docs/SERVER_CORE_DESIGN.md docs/DESIGN_DELTA.md docs/LOAD_SCOPE.md docs/G_ACE_WORKSPACE.md docs/SERVER_COMMAND_CONTRACT.md docs/STRUCTURE.md docs/WORKSPACE_REGISTRY.md docs/PROJECT_TEMPLATE.md docs/PROJECT_INTEGRATION_RULES.md docs/AUTO_COMMIT.md docs/DEPLOY_RUNBOOK.md docs/WORKSPACE_MCP.md docs/WORKSPACE_SHARED_SECRETS.md docs/KB_REUSE_DESIGN.md docs/STORAGE_LIFECYCLE.md docs/CLOUDFLARE_OPERATIONS.md docs/GITHUB_SKILL.md docs/GITHUB_FREE_MAX.md docs/GLOSSARY.md operations/pre-execution-schema.json operations/workspace-mcp.json operations/storage-lifecycle.json operations/cloudflare-account.json operations/huggingface.json operations/github-project-control.json scripts/init-dev-workspace.sh scripts/install-workspace-mcp.sh scripts/verify-workspace-mcp.sh scripts/ai-auto-commit.sh scripts/resolve-codex-skill.sh scripts/github-skill-path.sh scripts/github_project_control.py scripts/github_project_control_test.py scripts/storage_lifecycle_audit.py scripts/workspace_command_center_check.py archive/isolated/2026-06-26/PROJECT_STATUS.before-tgserver-canonical.archived.md)
          for path in "${required[@]}"; do test -e "$path" || { echo "MISSING_REQUIRED=$path"; exit 1; }; done
          echo 'REQUIRED_AUTHORITY=PASS'

      - name: Retired and client-local authority exclusion
        run: |
          set -euo pipefail
          blocked=(KB.md PROJECT_STATUS.md add-status.sh docs/OPERATION_CHECKLIST.md .cursor/mcp.json .cursor/agents .cursor/rules/01_japanese_thinking.mdc)
          for path in "${blocked[@]}"; do test ! -e "$path" || { echo "BLOCKED_CURRENT_AUTHORITY=$path"; exit 1; }; done
          grep -qx '.cursor/mcp.json' .gitignore
          grep -qx '.cursor/agents' .gitignore
          ! grep -Eq '^(\.github|scripts)/?$' .aiignore .cursorignore
          grep -qx 'archive/' .aiignore
          grep -qx 'archive/' .cursorignore
          echo 'AUTHORITY_EXCLUSION=PASS'

      - name: No session-only or credential material in current authority
        run: |
          set -euo pipefail
          hits="$(git grep -nEI '(CONFIRMED_BY_MASTER|全チャット|thinkingブロック|hidden[- ]?reasoning|private reasoning.*rule|このチャットだけ|今回の会話だけ)' -- '*.md' '*.mdc' ':!archive/**' ':!docs/DESIGN_DELTA.md' || true)"
          test -z "$hits" || { printf '%s\n' "$hits"; exit 1; }
          env_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '(^|/)\.env\.example$' || true)"
          test -z "$env_files" || { printf '%s\n' "$env_files"; exit 1; }
          echo 'CURRENT_AUTHORITY_HYGIENE=PASS'

      - name: Canonical authority references and restored scope
        run: |
          set -euo pipefail
          require_text() { local pattern="$1" file="$2" label="$3"; grep -qE "$pattern" "$file" || { echo "MISSING_INVARIANT=$label FILE=$file"; exit 1; }; }
          require_absent() { local pattern="$1" label="$2"; shift 2; if git grep -nE "$pattern" -- "$@"; then echo "FORBIDDEN_INVARIANT=$label"; exit 1; fi; }
          require_text 'docs/SERVER_COMMAND_CONTRACT\.md' README.md server_command_authority
          require_text 'operations/pre-execution-schema\.json' README.md dispatch_schema_reference
          require_text 'server-core.*Command Center' docs/G_ACE_WORKSPACE.md workspace_command_center
          require_text 'Development Routine' docs/G_ACE_WORKSPACE.md fixed_development_routine
          require_text '非技術者のMaster' README.md master_nontechnical_command_center_purpose
          require_text 'non-technical Master' docs/SERVER_CORE_DESIGN.md master_nontechnical_design_purpose
          require_text '非技術者のMaster' .cursor/rules/00_agent_runtime.mdc master_nontechnical_agent_runtime
          require_text 'Master does not repeat' .github/copilot-instructions.md copilot_automatic_server_core_entry
          require_text 'start of every new chat/task' AGENTS.md shared_agent_automatic_server_core_entry
          require_text 'Masterが新規チャット冒頭' docs/G_ACE_WORKSPACE.md workspace_automatic_ai_entry_requirement
          require_text '会話履歴や一時作業状態' README.md self_contained_workspace_recovery
          require_text 'SERVER_CORE_MUTATION_AUTHORIZED' README.md server_core_mutation_gate_readme
          require_text 'SERVER_CORE_MUTATION_AUTHORIZED' SERVER_CORE_PROTOCOL.md server_core_mutation_gate_protocol
          require_text 'REVERSIBLE_LOCAL_MUTATION' docs/SERVER_COMMAND_CONTRACT.md reversible_local_mutation
          require_text 'Current completed / verified state' docs/GLOSSARY.md project_readme_current_state
          require_text 'Work Report Commit' docs/GLOSSARY.md commit_as_work_report
          require_text 'd88e99273319dad1b27092e14085c7060710fc92' docs/DESIGN_DELTA.md command_center_delta_commit_preserved
          require_text 'af9abd3e9d402f73430d7c97f270463a62f75f18' docs/DESIGN_DELTA.md cloudflare_delta_commit_preserved
          require_text 'Do not rewrite or delete prior accepted deltas' docs/DESIGN_DELTA.md append_only_design_delta_history
          require_text 'ARCHIVED OLD WORK HISTORY - DO NOT LOAD AS CURRENT CONTEXT' archive/isolated/2026-06-26/PROJECT_STATUS.before-tgserver-canonical.archived.md archived_history_preserved
          require_text 'GitHubの利用Costを無駄に増やさず' docs/GITHUB_FREE_MAX.md github_cost_policy
          require_text 'INTERVAL=weekly' docs/GITHUB_FREE_MAX.md bounded_dependabot_policy
          require_text 'package-ecosystem: github-actions' .github/dependabot.yml dependabot_github_actions
          require_text 'interval: weekly' .github/dependabot.yml dependabot_weekly
          require_text 'open-pull-requests-limit: 3' .github/dependabot.yml dependabot_bounded_prs
          require_text 'Docker Composeを正' README.md docker_compose_readme
          require_text 'Docker Compose.*正' CORE.md docker_compose_core
          require_text 'Docker Composeを正' SERVER_CORE_PROTOCOL.md docker_compose_protocol
          require_text 'Docker Composeを正' docs/G_ACE_WORKSPACE.md docker_compose_workspace
          require_text 'Docker Composeを正' .cursor/rules/00_agent_runtime.mdc docker_compose_agent_runtime
          require_text 'Docker Composeを正' docs/DEPLOY_RUNBOOK.md docker_compose_deploy
          require_text 'Docker Compose as the canonical production residency path' docs/SERVER_CORE_DESIGN.md docker_compose_design
          require_absent 'Workspace top-level|GPT↔operator|operator-facing command presentation|ASSISTANT_TOOL|USER_UI|EXTERNAL_CLIENT|EXECUTION_ROUTE|EXECUTION_CAPABILITY|EXECUTION_AUTHORIZATION|PRE_EXECUTION_COMPLETE|Chat UI|ChatGPT|Notion|generic executor|generic AI cost policy' overgeneralized_non_server_policy README.md docs/SERVER_CORE_DESIGN.md docs/G_ACE_WORKSPACE.md docs/LOAD_SCOPE.md docs/SERVER_COMMAND_CONTRACT.md .cursor/rules/00_agent_runtime.mdc operations/pre-execution-schema.json
          require_absent 'Project固有の正式例外|formally defined Project exception|Project Authorityで正式例外|正式な例外経路' docker_compose_exception README.md CORE.md SERVER_CORE_PROTOCOL.md docs/SERVER_CORE_DESIGN.md docs/G_ACE_WORKSPACE.md docs/DEPLOY_RUNBOOK.md .cursor/rules/00_agent_runtime.mdc
          echo 'AUTHORITY_ROUTING=PASS'

      - name: Machine contract validation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          pre=json.loads(Path('operations/pre-execution-schema.json').read_text())
          assert pre['schema_version'] == '1.5'
          assert pre['name'] == 'gace-command-center-dispatch'
          required=set(pre['required_fields'])
          assert {'PURPOSE','EXPECTED_RESULT','TARGET_PROJECT','TARGET_REPOSITORY','MUTATION_REPOSITORIES','READ_ONLY_REPOSITORIES','SERVER_CORE_MUTATION_AUTHORIZED','REQUIRED_SERVER_CORE_AUTHORITY','REQUIRED_PROJECT_AUTHORITY','REUSE_CANDIDATES','VERIFY_PATH','APPROVAL_BOUNDARY','CHANGE_BOUNDARY','CONTEXT_SCOPE','BLOCKER'} <= required
          assert 'EXECUTION_ROUTE' not in required
          assert 'PRE_EXECUTION_COMPLETE' not in required
          assert 'execution_routes' not in pre
          assert 'mutation_classes' not in pre
          assert pre['rules']['fixed_development_routine_must_not_be_skipped_without_reason'] is True
          assert pre['rules']['debugai_reuses_existing_evidence_before_server_ai_research'] is True
          assert 'chat_ui_notion_and_external_app_interaction_are_outside_server_core' not in pre['rules']
          mcp=json.loads(Path('operations/workspace-mcp.json').read_text())
          assert mcp['scope']=='workspace-global'
          assert set(mcp['servers']) >= {'cloudflare-api','huggingface'}
          assert mcp['installation']['backup_keep'] >= 1
          assert mcp['installation']['required_mode']=='owner_read_only_0400_or_owner_read_write_0600_non_executable'
          assert mcp['installation']['concurrency']=='single-writer-fail-closed'
          for name,cfg in mcp['servers'].items():
              assert cfg.get('url','').startswith('https://')
              assert 'headers' not in cfg and 'env' not in cfg
          storage=json.loads(Path('operations/storage-lifecycle.json').read_text())
          assert storage['mode']=='audit_only'
          assert storage['allow_delete'] is False
          assert storage['docker']['allow_prune'] is False
          assert storage['docker']['allow_volume_delete'] is False
          for name in ('cloudflare-account.json','huggingface.json'):
              obj=json.loads((Path('operations')/name).read_text())
              assert isinstance(obj,dict)
          print('MACHINE_CONTRACTS=PASS')
          PY

      - name: Script syntax and mutation gates
        run: |
          set -euo pipefail
          bash -n scripts/init-dev-workspace.sh scripts/install-workspace-mcp.sh scripts/verify-workspace-mcp.sh scripts/ai-auto-commit.sh scripts/resolve-codex-skill.sh scripts/github-skill-path.sh
          python3 -m py_compile scripts/storage_lifecycle_audit.py scripts/workspace_command_center_check.py
          grep -q -- '--apply-workspace-mutation' scripts/init-dev-workspace.sh
          grep -q -- '--create-project' scripts/init-dev-workspace.sh
          grep -q 'validate_project_name' scripts/init-dev-workspace.sh
          grep -q 'COPILOT_INSTRUCTIONS_LINK_CREATED' scripts/init-dev-workspace.sh
          grep -q 'AGENTS_ENTRY_LINK_CREATED' scripts/init-dev-workspace.sh
          grep -q 'COPILOT_INSTRUCTIONS_LINK' scripts/workspace_command_center_check.py
          grep -q 'AGENTS_ENTRY_LINK' scripts/workspace_command_center_check.py
          grep -q 'github.copilot.chat.codeGeneration.useInstructionFiles' scripts/workspace_command_center_check.py
          grep -q 'chat.useAgentsMdFile' scripts/workspace_command_center_check.py
          grep -q -- '--apply-workspace-mcp-mutation' scripts/install-workspace-mcp.sh
          grep -q 'flock -n 9' scripts/install-workspace-mcp.sh
          grep -q -- '--client-readback' scripts/verify-workspace-mcp.sh
          grep -q -- '--authorize-workspace-mutation' scripts/workspace_command_center_check.py
          grep -q 'WORKSPACE_WIRING=PASS' scripts/workspace_command_center_check.py
          grep -q -- '--authorize-server-core-mutation' scripts/ai-auto-commit.sh
          grep -q -- '--file' scripts/ai-auto-commit.sh
          grep -q 'flock -n 9' scripts/ai-auto-commit.sh
          grep -q 'refusing unreadable or non-UTF-8 intended file' scripts/ai-auto-commit.sh
          ! grep -q 'git add -A' scripts/ai-auto-commit.sh
          echo 'SCRIPT_GATES=PASS'

      - name: Read-only helper self tests
        run: |
          set -euo pipefail
          python3 scripts/storage_lifecycle_audit.py --self-test
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          if HOME="$tmp" bash scripts/install-workspace-mcp.sh >"$tmp/install.out" 2>&1; then exit 1; fi
          test ! -e "$tmp/.cursor/mcp.json"
          grep -q 'NO_CHANGES_PERFORMED' "$tmp/install.out"
          if python3 scripts/workspace_command_center_check.py --root "$tmp" --repair >"$tmp/repair.out" 2>&1; then exit 1; fi
          test ! -e "$tmp/workspace/G-ACE.code-workspace"
          grep -q 'NO_CHANGES_PERFORMED' "$tmp/repair.out"
          echo 'NEGATIVE_MUTATION_GATES=PASS'
