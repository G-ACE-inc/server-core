name: server-core-guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-core-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required authority files
        run: |
          set -euo pipefail
          test -f README.md
          test -f SERVER_CORE_PROTOCOL.md
          test -f CORE.md
          test -f docs/SERVER_CORE_DESIGN.md
          test -f docs/DESIGN_DELTA.md
          test -f docs/LOAD_SCOPE.md
          test -f docs/STRUCTURE.md
          test -f docs/WORKSPACE_REGISTRY.md
          test -f docs/KB_REUSE_DESIGN.md
          test -f docs/STORAGE_LIFECYCLE.md
          test -f docs/GLOSSARY.md
          test -f docs/PROJECT_TEMPLATE.md
          test -f docs/DEPLOY_RUNBOOK.md
          test -f docs/AUTO_COMMIT.md
          test -f docs/GITHUB_FREE_MAX.md
          test -f docs/GITHUB_SKILL.md
          test -f docs/G_ACE_WORKSPACE.md
          test -f docs/WORKSPACE_SHARED_SECRETS.md
          test -f docs/CLOUDFLARE_OPERATIONS.md
          test -f operations/storage-lifecycle.json
          test -f scripts/storage_lifecycle_audit.py
          test -x scripts/ai-auto-commit.sh
          test -x scripts/resolve-codex-skill.sh
          test -x scripts/github-skill-path.sh

      - name: No redundant retired authorities
        run: |
          set -euo pipefail
          test ! -e KB.md
          test ! -e PROJECT_STATUS.md
          test ! -e add-status.sh
          test ! -e docs/OPERATION_CHECKLIST.md
          ! git grep -nE '(^|[^A-Za-z0-9_])(KB\.md|PROJECT_STATUS\.md|OPERATION_CHECKLIST\.md)([^A-Za-z0-9_]|$)' -- ':!archive/**' ':!.github/workflows/server-core-guard.yml'

      - name: Command center authority contract
        run: |
          set -euo pipefail
          grep -q 'G-ACE Workspace Command Center' README.md
          grep -q 'Workspace command center' docs/SERVER_CORE_DESIGN.md
          grep -q 'Command Center Responsibilities' docs/SERVER_CORE_DESIGN.md
          grep -q 'Command Flow' docs/SERVER_CORE_DESIGN.md
          grep -q 'Command-Center Invariants' docs/SERVER_CORE_DESIGN.md
          grep -q 'SERVER CORE DESIGN DELTA' docs/DESIGN_DELTA.md
          grep -q 'Formalize server-core as the G-ACE Workspace command center' docs/DESIGN_DELTA.md
          grep -q 'COMMAND ROUTER' docs/LOAD_SCOPE.md
          grep -q 'Command-Center Dispatch' docs/G_ACE_WORKSPACE.md
          grep -q 'G-ACE WORKSPACE REGISTRY' docs/WORKSPACE_REGISTRY.md
          grep -q 'Dispatch Rule' docs/WORKSPACE_REGISTRY.md
          grep -q 'Availability Gate' docs/WORKSPACE_REGISTRY.md
          grep -q 'WORKSPACE SHARED SECRETS' docs/WORKSPACE_SHARED_SECRETS.md
          grep -q 'Add-New-Contract Gate' docs/WORKSPACE_SHARED_SECRETS.md
          grep -q 'Command Center' docs/STRUCTURE.md

      - name: Provider ownership boundary
        run: |
          set -euo pipefail
          grep -q 'WORKSPACE COMMAND CONTRACT' docs/CLOUDFLARE_OPERATIONS.md
          grep -q 'Project-specific Cloudflare Documentation' docs/CLOUDFLARE_OPERATIONS.md
          grep -q 'server-coreはCloudflareを.*司令室' docs/CLOUDFLARE_OPERATIONS.md
          ! grep -q 'api\.asterav8\.jp' docs/CLOUDFLARE_OPERATIONS.md
          ! grep -q 'astera-v8-prod' docs/CLOUDFLARE_OPERATIONS.md
          test ! -e operations/cloudflare.json
          test ! -e scripts/cloudflare_ops.py
          ! git grep -nE 'GPG-Core|astera-v8-prod|api\\.asterav8\\.jp' -- ':!archive/**' ':!docs/DESIGN_DELTA.md'
          grep -q 'libral-vault' operations/cloudflare-account.json
          grep -q 'secret_provider.*libral-vault' operations/cloudflare-account.json

      - name: LibralCore execution contract
        run: |
          set -euo pipefail
          grep -q '開発AIが再利用可能な設計とCodeを効率よく生成・修正するための開発概念' CORE.md
          grep -q '開発時間、AIコンテキスト、Token' CORE.md
          grep -q '開発上の再利用単位' CORE.md
          grep -q '既存資産をそのまま利用' CORE.md
          grep -q '目的と期待結果を確定' CORE.md
          grep -q '5段階層型モジュラーアーキテクチャ' CORE.md
          grep -q '^Part$' CORE.md
          grep -q '^Feature$' CORE.md
          grep -q '^Component$' CORE.md
          grep -q '^System$' CORE.md
          grep -q '^Application System$' CORE.md

      - name: Routed workspace contract
        run: |
          set -euo pipefail
          grep -q 'server-core/README.md' docs/LOAD_SCOPE.md
          grep -q 'docs/LOAD_SCOPE.md' README.md
          grep -q 'Documentation Gate' docs/SERVER_CORE_DESIGN.md
          grep -q 'GitHub Work Report Contract' docs/SERVER_CORE_DESIGN.md
          grep -q 'server-core司令室' docs/G_ACE_WORKSPACE.md
          grep -q 'server-core/README.md' .cursor/rules/00_agent_runtime.mdc
          grep -q 'WORKSPACE_REGISTRY.md' README.md
          grep -q 'KB_REUSE_DESIGN.md' docs/LOAD_SCOPE.md
          grep -q 'STORAGE_LIFECYCLE.md' SERVER_CORE_PROTOCOL.md

      - name: Progressive load scope
        run: |
          set -euo pipefail
          grep -q 'Level 1: Target Boundary' docs/LOAD_SCOPE.md
          grep -q 'Level 2: Adjacent Boundary' docs/LOAD_SCOPE.md
          grep -q 'Level 3: Reuse Unit' docs/LOAD_SCOPE.md
          grep -q 'Level 4: System / Repository' docs/LOAD_SCOPE.md
          grep -q 'Reuse Search Order' docs/LOAD_SCOPE.md
          grep -q 'Stop Reading Condition' docs/LOAD_SCOPE.md
          grep -q 'archive/' docs/LOAD_SCOPE.md
          grep -q '.github/' docs/LOAD_SCOPE.md
          grep -q 'scripts/' docs/LOAD_SCOPE.md

      - name: Minimum project template
        run: |
          set -euo pipefail
          grep -q '開発開始前の確認' docs/PROJECT_TEMPLATE.md
          grep -q '最小必須構成' docs/PROJECT_TEMPLATE.md
          grep -q 'Single Source of Truth' docs/PROJECT_TEMPLATE.md
          grep -q 'Module化判定' docs/PROJECT_TEMPLATE.md
          grep -q 'AIへ渡す最小情報' docs/PROJECT_TEMPLATE.md
          grep -q 'Documentation Gate' docs/PROJECT_TEMPLATE.md
          grep -q 'System / Feature-bundle Document' docs/PROJECT_TEMPLATE.md
          grep -q '実行順序' docs/PROJECT_TEMPLATE.md
          grep -q '期待出力、状態変化、既存機能回帰' docs/PROJECT_TEMPLATE.md

      - name: GitHub work-report and deploy contracts
        run: |
          set -euo pipefail
          grep -q 'Commit = Work Report' docs/AUTO_COMMIT.md
          grep -q 'REMOTE_READBACK' docs/AUTO_COMMIT.md
          grep -q 'confirmed GitHub revision' docs/DEPLOY_RUNBOOK.md
          grep -q 'Runtime Verification' docs/DEPLOY_RUNBOOK.md

      - name: KB design contract
        run: |
          set -euo pipefail
          grep -q 'Command-Center Boundary' docs/KB_REUSE_DESIGN.md
          grep -q 'Registration Contract' docs/KB_REUSE_DESIGN.md
          grep -q 'MCP / API Bridge' docs/KB_REUSE_DESIGN.md
          grep -q 'Document / Runtime Completion Boundary' docs/KB_REUSE_DESIGN.md

      - name: Storage lifecycle audit contract
        run: |
          set -euo pipefail
          grep -q 'Safe Deletion Gate' docs/STORAGE_LIFECYCLE.md
          grep -q 'SAFE_TO_DELETE' docs/STORAGE_LIFECYCLE.md
          grep -q 'Document / Runtime Completion Boundary' docs/STORAGE_LIFECYCLE.md
          python3 -m py_compile scripts/storage_lifecycle_audit.py
          python3 scripts/storage_lifecycle_audit.py --self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('operations/storage-lifecycle.json').read_text())
          assert p['mode'] == 'audit_only'
          assert p['allow_delete'] is False
          assert p['docker']['allow_prune'] is False
          assert p['docker']['allow_volume_delete'] is False
          print('STORAGE_LIFECYCLE_POLICY=PASS')
          PY

      - name: Project integration contract
        run: |
          set -euo pipefail
          test -f docs/PROJECT_INTEGRATION_RULES.md
          grep -q '## TGserver Integration' docs/PROJECT_INTEGRATION_RULES.md
          grep -q '## webhook gateway Integration' docs/PROJECT_INTEGRATION_RULES.md
          grep -q '## Libral Vault Usage' docs/PROJECT_INTEGRATION_RULES.md
          grep -q '## MCP / Tool Usage' docs/PROJECT_INTEGRATION_RULES.md
          grep -q 'Secret実値は保存しない' docs/PROJECT_INTEGRATION_RULES.md
          grep -q 'Project Integration' README.md
          grep -q 'TGserver / webhook gatewayはShared Capabilityではなく' docs/WORKSPACE_REGISTRY.md
          grep -q 'TGserver / webhook gatewayはShared CapabilityではなくProject Integration' docs/SERVER_CORE_DESIGN.md
          grep -q 'PROJECT_INTEGRATION_RULES.md' docs/LOAD_SCOPE.md

      - name: Workspace initializer safety
        run: |
          set -euo pipefail
          bash -n scripts/init-dev-workspace.sh
          ! grep -nE 'rm[[:space:]]+-rf.*PROJECTS_RULES|rm[[:space:]]+-rf.*projects/\.cursor/rules' scripts/init-dev-workspace.sh
          grep -q 'already exists and is not the required symlink; no deletion performed' scripts/init-dev-workspace.sh
          grep -q 'unexpected target' scripts/init-dev-workspace.sh

      - name: No tracked env files
        run: |
          set -euo pipefail
          blocked="$(
            git ls-files |
              grep -E '(^|/)\.env($|\.)' |
              grep -Ev '(^|/)\.env\.example$' || true
          )"
          if [ -n "$blocked" ]; then
            echo "$blocked"
            exit 1
          fi

      - name: No legacy TGserver spelling
        run: |
          set -euo pipefail
          hits="$(
            git grep -n 'TGServer' -- '*.md' ':!docs/GLOSSARY.md' ':!archive/**' || true
          )"
          if [ -n "$hits" ]; then
            echo "$hits"
            exit 1
          fi

      - name: Secret pattern guard
        run: |
          set -euo pipefail
          hits="$(
            git grep -nEI \
              '(api[_-]?key|secret|token|password|credential|session)[[:alnum:]_ -]*[:=][[:space:]]*[\"]?[A-Za-z0-9_./+=-]{12,}' \
              -- \
              ':!docs/**' \
              ':!archive/**' \
              ':!.github/workflows/server-core-guard.yml' \
              ':!scripts/ai-auto-commit.sh' || true
          )"
          hits="$(printf '%s\n' "$hits" | grep -Ev '=[[:space:]]*(os\.environ\.get|check_token_not_in_env)\(' || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            exit 1
          fi

      - name: Shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git ls-files '*.sh')
