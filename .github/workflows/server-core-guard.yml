name: server-core-guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-core-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Required authority and machine contracts
        run: |
          set -euo pipefail
          required=(README.md CORE.md SERVER_CORE_PROTOCOL.md docs/SERVER_CORE_DESIGN.md docs/DESIGN_DELTA.md docs/LOAD_SCOPE.md docs/G_ACE_WORKSPACE.md docs/SERVER_COMMAND_CONTRACT.md docs/STRUCTURE.md docs/WORKSPACE_REGISTRY.md docs/PROJECT_TEMPLATE.md docs/PROJECT_INTEGRATION_RULES.md docs/AUTO_COMMIT.md docs/DEPLOY_RUNBOOK.md docs/WORKSPACE_MCP.md docs/WORKSPACE_SHARED_SECRETS.md docs/KB_REUSE_DESIGN.md docs/STORAGE_LIFECYCLE.md docs/CLOUDFLARE_OPERATIONS.md docs/GITHUB_SKILL.md docs/GLOSSARY.md operations/pre-execution-schema.json operations/workspace-mcp.json operations/storage-lifecycle.json operations/cloudflare-account.json operations/huggingface.json scripts/init-dev-workspace.sh scripts/install-workspace-mcp.sh scripts/verify-workspace-mcp.sh scripts/ai-auto-commit.sh scripts/resolve-codex-skill.sh scripts/github-skill-path.sh scripts/storage_lifecycle_audit.py scripts/workspace_command_center_check.py)
          for path in "${required[@]}"; do test -e "$path" || { echo "MISSING_REQUIRED=$path"; exit 1; }; done
          echo 'REQUIRED_AUTHORITY=PASS'

      - name: Retired and client-local authority exclusion
        run: |
          set -euo pipefail
          blocked=(KB.md PROJECT_STATUS.md add-status.sh docs/OPERATION_CHECKLIST.md docs/GITHUB_FREE_MAX.md .cursor/mcp.json .cursor/agents .cursor/rules/01_japanese_thinking.mdc .github/dependabot.yml)
          for path in "${blocked[@]}"; do test ! -e "$path" || { echo "BLOCKED_CURRENT_AUTHORITY=$path"; exit 1; }; done
          grep -qx '.cursor/mcp.json' .gitignore
          grep -qx '.cursor/agents' .gitignore
          ! grep -Eq '^(\.github|scripts)/?$' .aiignore .cursorignore
          grep -qx 'archive/' .aiignore
          grep -qx 'archive/' .cursorignore
          echo 'AUTHORITY_EXCLUSION=PASS'

      - name: No conversational or credential material in current authority
        run: |
          set -euo pipefail
          hits="$(git grep -nEI '(CONFIRMED_BY_MASTER|Masterの明示|Masterが|全チャット|thinkingブロック|hidden[- ]?reasoning|private reasoning.*rule)' -- '*.md' '*.mdc' ':!archive/**' ':!docs/DESIGN_DELTA.md' || true)"
          test -z "$hits" || { printf '%s\n' "$hits"; exit 1; }
          env_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '(^|/)\.env\.example$' || true)"
          test -z "$env_files" || { printf '%s\n' "$env_files"; exit 1; }
          echo 'CURRENT_AUTHORITY_HYGIENE=PASS'

      - name: Canonical authority references
        run: |
          set -euo pipefail
          grep -q 'docs/SERVER_COMMAND_CONTRACT.md' README.md
          grep -q 'operations/pre-execution-schema.json' README.md
          grep -q 'operations/pre-execution-schema.json' docs/G_ACE_WORKSPACE.md
          grep -q 'operations/pre-execution-schema.json' docs/LOAD_SCOPE.md
          grep -q 'operations/pre-execution-schema.json' .cursor/rules/00_agent_runtime.mdc
          grep -q 'SERVER_CORE_PROTOCOL.md' docs/PROJECT_INTEGRATION_RULES.md
          grep -q 'explicit owner authorization' README.md
          grep -q 'SERVER_CORE_MUTATION_AUTHORIZED' SERVER_CORE_PROTOCOL.md
          grep -q 'REVERSIBLE_LOCAL_MUTATION' docs/SERVER_COMMAND_CONTRACT.md
          grep -q '## 2. Operator Interface Boundary' docs/SERVER_COMMAND_CONTRACT.md
          grep -q 'operator_interface_defined_outside_server_core' operations/pre-execution-schema.json
          ! grep -q '6072' docs/SERVER_COMMAND_CONTRACT.md
          echo 'AUTHORITY_ROUTING=PASS'

      - name: Machine contract validation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          pre=json.loads(Path('operations/pre-execution-schema.json').read_text())
          assert pre['schema_version']
          required=set(pre['required_fields'])
          assert {'TARGET_REPOSITORY','MUTATION_REPOSITORIES','READ_ONLY_REPOSITORIES','EXECUTION_ROUTE','EXECUTION_AUTHORIZATION','AUTHORIZATION_SCOPE','MUTATION_CLASS','PRE_EXECUTION_COMPLETE','BLOCKER'} <= required
          assert {'ASSISTANT_TOOL','DETERMINISTIC_LOCAL_OR_CI','SERVER_COMMAND','SERVER_AI'} <= set(pre['execution_routes'])
          assert {'READ_ONLY_INSPECTION','REVERSIBLE_LOCAL_MUTATION','REPOSITORY_MUTATION','RUNTIME_MUTATION','PROVIDER_MUTATION','PRODUCTION_MUTATION'} <= set(pre['mutation_classes'])
          assert pre['rules']['authorization_is_task_scoped'] is True
          assert pre['rules']['operator_interface_defined_outside_server_core'] is True
          mcp=json.loads(Path('operations/workspace-mcp.json').read_text())
          assert mcp['scope']=='workspace-global'
          assert set(mcp['servers']) >= {'cloudflare-api','huggingface'}
          assert mcp['installation']['backup_keep'] >= 1
          assert mcp['installation']['required_mode'].startswith('0600')
          assert mcp['installation']['concurrency']=='single-writer-fail-closed'
          for name,cfg in mcp['servers'].items():
              assert cfg.get('url','').startswith('https://')
              assert 'headers' not in cfg and 'env' not in cfg
          storage=json.loads(Path('operations/storage-lifecycle.json').read_text())
          assert storage['mode']=='audit_only'
          assert storage['allow_delete'] is False
          assert storage['docker']['allow_prune'] is False
          assert storage['docker']['allow_volume_delete'] is False
          for name in ('cloudflare-account.json','huggingface.json'):
              obj=json.loads((Path('operations')/name).read_text())
              assert isinstance(obj,dict)
          print('MACHINE_CONTRACTS=PASS')
          PY

      - name: Script syntax and mutation gates
        run: |
          set -euo pipefail
          bash -n scripts/init-dev-workspace.sh scripts/install-workspace-mcp.sh scripts/verify-workspace-mcp.sh scripts/ai-auto-commit.sh scripts/resolve-codex-skill.sh scripts/github-skill-path.sh
          python3 -m py_compile scripts/storage_lifecycle_audit.py scripts/workspace_command_center_check.py
          grep -q -- '--apply-workspace-mutation' scripts/init-dev-workspace.sh
          grep -q -- '--create-project' scripts/init-dev-workspace.sh
          grep -q 'validate_project_name' scripts/init-dev-workspace.sh
          grep -q -- '--apply-workspace-mcp-mutation' scripts/install-workspace-mcp.sh
          grep -q 'flock -n 9' scripts/install-workspace-mcp.sh
          grep -q -- '--client-readback' scripts/verify-workspace-mcp.sh
          grep -q -- '--authorize-workspace-mutation' scripts/workspace_command_center_check.py
          grep -q 'WORKSPACE_WIRING=PASS' scripts/workspace_command_center_check.py
          grep -q -- '--authorize-server-core-mutation' scripts/ai-auto-commit.sh
          grep -q -- '--file' scripts/ai-auto-commit.sh
          grep -q 'flock -n 9' scripts/ai-auto-commit.sh
          ! grep -q 'git add -A' scripts/ai-auto-commit.sh
          echo 'SCRIPT_GATES=PASS'

      - name: Read-only helper self tests
        run: |
          set -euo pipefail
          python3 scripts/storage_lifecycle_audit.py --self-test
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          if HOME="$tmp" bash scripts/install-workspace-mcp.sh >"$tmp/install.out" 2>&1; then exit 1; fi
          test ! -e "$tmp/.cursor/mcp.json"
          grep -q 'NO_CHANGES_PERFORMED' "$tmp/install.out"
          if python3 scripts/workspace_command_center_check.py --root "$tmp" --repair >"$tmp/repair.out" 2>&1; then exit 1; fi
          test ! -e "$tmp/workspace/G-ACE.code-workspace"
          grep -q 'NO_CHANGES_PERFORMED' "$tmp/repair.out"
          echo 'NEGATIVE_MUTATION_GATES=PASS'
