name: server-core-guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-core-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required files
        run: |
          set -euo pipefail
          test -f README.md
          test -f SERVER_CORE_PROTOCOL.md
          test -f CORE.md
          test -f KB.md
          test -f PROJECT_STATUS.md
          test -f docs/LOAD_SCOPE.md
          test -f docs/STRUCTURE.md
          test -f docs/GLOSSARY.md
          test -f docs/PROJECT_TEMPLATE.md
          test -f docs/DEPLOY_RUNBOOK.md
          test -f docs/OPERATION_CHECKLIST.md
          test -f docs/AUTO_COMMIT.md
          test -f docs/GITHUB_FREE_MAX.md
          test -f docs/GITHUB_SKILL.md
          test -f docs/G_ACE_WORKSPACE.md
          test -x scripts/ai-auto-commit.sh
          test -x scripts/resolve-codex-skill.sh
          test -x scripts/github-skill-path.sh

      - name: LibralCore development-method contract
        run: |
          set -euo pipefail
          grep -q '開発AIが再利用可能な設計とCodeを効率よく生成・修正するための開発概念' CORE.md
          grep -q '開発時にのみ適用し、各Application Systemの実行構造には関与しない' CORE.md
          grep -q '開発上の再利用単位' CORE.md
          grep -q '既存資産をそのまま利用' CORE.md
          grep -q '開発時間、AIコンテキスト、Token' CORE.md
          grep -q 'LibralCoreの正式定義' KB.md

      - name: No runtime-core architecture assumptions
        run: |
          set -euo pipefail
          hits="$(
            git grep -nE \
              'Moduleは、Coreが|CoreがLifecycle|Required Module|Optional Module|Health・Readiness管理|Module登録情報|Lifecycleと障害時動作|Coreの責務は次に限定|必要な処理Routing|アプリ接続基盤|共通Runtime|Module Registry|Plugin Host|中央Core' \
              -- '*.md' '*.mdc' '*.yml' '*.yaml' \
              ':!archive/**' \
              ':!.github/workflows/server-core-guard.yml' || true
          )"
          if [ -n "$hits" ]; then
            echo "$hits"
            exit 1
          fi

      - name: Five-stage architecture contract
        run: |
          set -euo pipefail
          grep -q '5段階層型モジュラーアーキテクチャ' CORE.md
          grep -q '^Part$' CORE.md
          grep -q '^Feature$' CORE.md
          grep -q '^Component$' CORE.md
          grep -q '^System$' CORE.md
          grep -q '^Application System$' CORE.md
          grep -q 'Moduleは5段の階層名ではない' CORE.md
          grep -q '既存構造への統合を優先' CORE.md

      - name: No legacy layer model
        run: |
          set -euo pipefail
          hits="$(
            git grep -nE 'Layer[[:space:]]+[1-5]|5層アーキテクチャ' \
              -- '*.md' '*.mdc' \
              ':!archive/**' \
              ':!.github/workflows/server-core-guard.yml' || true
          )"
          if [ -n "$hits" ]; then
            echo "$hits"
            exit 1
          fi

      - name: No physical five-stage directories
        run: |
          set -euo pipefail
          hits="$(
            git ls-files |
              grep -E '(^|/)(parts|features|components|systems|application-systems)/' || true
          )"
          if [ -n "$hits" ]; then
            echo "$hits"
            exit 1
          fi

      - name: Progressive load scope
        run: |
          set -euo pipefail
          grep -q '最小開始範囲' docs/LOAD_SCOPE.md
          grep -q 'Level 1: 対象' docs/LOAD_SCOPE.md
          grep -q 'Level 2: 境界' docs/LOAD_SCOPE.md
          grep -q 'Level 3: 再利用単位' docs/LOAD_SCOPE.md
          grep -q 'Level 4: System' docs/LOAD_SCOPE.md
          grep -q '読込範囲を拡張する条件' docs/LOAD_SCOPE.md
          grep -q '再利用探索' docs/LOAD_SCOPE.md
          grep -q 'リポジトリ全体を既定でスキャン' docs/LOAD_SCOPE.md
          grep -q 'archive/' docs/LOAD_SCOPE.md
          grep -q '.github/' docs/LOAD_SCOPE.md
          grep -q 'scripts/' docs/LOAD_SCOPE.md

      - name: Minimum project template
        run: |
          set -euo pipefail
          grep -q '開発開始前の確認' docs/PROJECT_TEMPLATE.md
          grep -q '最小必須構成' docs/PROJECT_TEMPLATE.md
          grep -q '一律作成してはならない' docs/PROJECT_TEMPLATE.md
          grep -q 'Single Source of Truth' docs/PROJECT_TEMPLATE.md
          grep -q 'Module化判定' docs/PROJECT_TEMPLATE.md
          grep -q '再利用候補を確認せず' docs/PROJECT_TEMPLATE.md
          grep -q 'HTTP 200だけでは合格にしない' docs/PROJECT_TEMPLATE.md

      - name: No tracked env files
        run: |
          set -euo pipefail
          blocked="$(
            git ls-files |
              grep -E '(^|/)\.env($|\.)' |
              grep -Ev '(^|/)\.env\.example$' || true
          )"
          if [ -n "$blocked" ]; then
            echo "$blocked"
            exit 1
          fi

      - name: No legacy TGserver spelling
        run: |
          set -euo pipefail
          hits="$(
            git grep -n 'TGServer' -- '*.md' ':!docs/GLOSSARY.md' ':!archive/**' || true
          )"
          if [ -n "$hits" ]; then
            echo "$hits"
            exit 1
          fi

      - name: PROJECT_STATUS is not a work log
        run: |
          set -euo pipefail
          if grep -nE '^### [0-9]{4}-[0-9]{2}-[0-9]{2}' PROJECT_STATUS.md; then
            exit 1
          fi

      - name: Secret pattern guard
        run: |
          set -euo pipefail
          hits="$(
            git grep -nEI \
              '(api[_-]?key|secret|token|password|credential|session)[[:alnum:]_ -]*[:=][[:space:]]*[\"]?[A-Za-z0-9_./+=-]{12,}' \
              -- \
              ':!docs/**' \
              ':!archive/**' \
              ':!.github/workflows/server-core-guard.yml' \
              ':!scripts/ai-auto-commit.sh' || true
          )"
          if [ -n "$hits" ]; then
            echo "$hits"
            exit 1
          fi

      - name: Shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git ls-files '*.sh')
