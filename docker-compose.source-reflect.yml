# Explicit Host admission overlay. Keep default bounded Host checkout READ-ONLY.
# The Host-owned UNIX socket is provisioned only by the separately approved
# source-reflect executor and is NOT exposed on TCP.
services:
  server-core-bounded-host:
    volumes:
      - type: bind
        source: "${GACE_HOST_SOURCE_REFLECT_SOCKET:?approved Host UNIX socket path required}"
        target: /run/gace/servercore-source-reflect.sock
        read_only: false
